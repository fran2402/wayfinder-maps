name: Build offline packs

# Builds one ready-made file per region (lines with every mode, and bike routes for countries
# and cities) and publishes them on the "packs" release, where the app downloads them.
# Run it by hand (optionally for a few regions) or let it refresh monthly. Big regions are split
# into shards built on separate machines; index.json joins them for the app.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region ids (empty = all), e.g. germany,london"
        required: false
        default: ""
  schedule:
    - cron: "23 2 3 * *"

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tile format
        run: ./gradlew --no-daemon -q -p packer run --args="selftest"
      - name: List regions
        id: list
        run: |
          ./gradlew --no-daemon -q -p packer run --args="list $PWD/regions.json ${{ github.event.inputs.regions }}"
          echo "regions=$(cat regions.json)" >> "$GITHUB_OUTPUT"
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create packs --repo "$GITHUB_REPOSITORY" --title "Offline packs" \
              --notes "Ready-made offline data for the Wayfinder app. Built by the 'Build offline packs' workflow." --latest=false

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Routes, roads and tracks from OpenStreetMap extracts
        # Geofabrik country extracts, filtered locally: bike route relations (far faster than
        # Overpass), and the roads and tracks lines are laid onto by geometry.
        # Any failure just leaves the builder to fall back to Overpass and Transitous shapes.
        continue-on-error: true
        env:
          SPEC: ${{ matrix.region }}
        run: |
          id="${SPEC%@*}"
          paths=$(jq -r --arg id "$id" '.[$id] // [] | .[]' packer/geofabrik.json)
          [ -z "$paths" ] && exit 0
          sudo apt-get install -y -qq osmium-tool >/dev/null
          pip install --quiet osmium
          mkdir -p osm
          for p in $paths; do
            f="osm/$(echo "$p" | tr / _).osm.pbf"
            curl -fsSL --retry 3 -o "$f" "https://download.geofabrik.de/$p-latest.osm.pbf"
            osmium tags-filter "$f" r/route=bicycle,mtb -o "$f.routes.pbf" --overwrite
            osmium tags-filter "$f" w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,busway,bus_guideway \
              w/railway=rail,narrow_gauge,light_rail,subway,tram,monorail -o "$f.ways.pbf" --overwrite
            rm -f "$f"
          done
          osmium merge osm/*.routes.pbf -o osm/routes.pbf --overwrite
          python3 packer/scripts/osm_routes.py osm/routes.pbf "$PWD/bikes.json" "$PWD/transit.json"
          osmium merge osm/*.ways.pbf -o osm/ways.pbf --overwrite
          rm -f osm/*.osm.pbf.ways.pbf
          osmium export osm/ways.pbf -c packer/osmium-export.json -f geojsonseq -o osm/ways.geojsonseq --overwrite
          rm -f osm/ways.pbf
          python3 packer/scripts/bucket_ways.py osm/ways.geojsonseq "$PWD/roads"
          rm -f osm/ways.geojsonseq
      - name: Build ${{ matrix.region }}
        run: ./gradlew --no-daemon -q -p packer run --args="build ${{ matrix.region }} $PWD/out $PWD/bikes.json $PWD/transit.json $PWD/roads"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ matrix.region }}
        run: |
          # "europe@3/8" publishes as europe.s3.*; replace only this shard's old files.
          id="${SPEC%@*}"
          if [ "$SPEC" != "$id" ]; then k="${SPEC#*@}"; name="$id.s${k%/*}"; else name="$id"; fi
          for old in $(gh release view packs --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E "^${name}(\.part[0-9]+)?\.zip$" || true); do
            gh release delete-asset packs "$old" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload packs out/* --repo "$GITHUB_REPOSITORY" --clobber

  index:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir meta
          gh release download packs --repo "$GITHUB_REPOSITORY" -p "*.json" -D meta || true
          rm -f meta/index.json
          assets=$(gh release view packs --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          stale=$(echo "$assets" | python3 packer/scripts/index.py meta)
          gh release upload packs meta/index.json --repo "$GITHUB_REPOSITORY" --clobber
          # Files left over from an older layout (e.g. before a region was split into shards).
          for f in $stale; do gh release delete-asset packs "$f" --repo "$GITHUB_REPOSITORY" -y || true; done
